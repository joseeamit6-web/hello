    <!-- GitHub Pages Single Page App routing restoration script -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
        // Handle query parameter p from 404.html
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var cleanPath = p.replace(/~and~/g, '&');
          var q = params.get('q');
          var finalUrl = cleanPath + (q ? '?' + q.replace(/~and~/g, '&') : '') + window.location.hash;
          window.history.replaceState(null, null, finalUrl);
        }
      })();
    </script>
