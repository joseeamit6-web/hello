<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AI Photo Studio</title>
    <script>
      // Single Page App redirect for GitHub Pages (works for custom domains and username.github.io/repo/)
      var l = window.location;
      var path = l.pathname;
      var segments = path.split('/').filter(Boolean);
      var known = ['editor', 'enhance', 'retouch', 'head-straightener', 'outfit-studio', 'background', 'passport-photo', 'print-studio', 'projects', 'help', 'privacy', 'terms'];
      var targetRoute = '';
      for (var i = 0; i < segments.length; i++) {
        if (known.indexOf(segments[i]) !== -1) {
          targetRoute = '/' + segments.slice(i).join('/');
          segments = segments.slice(0, i);
          break;
        }
      }
      var base = '/' + (segments.length ? segments.join('/') + '/' : '');
      l.replace(base + '#' + (targetRoute || '/'));
    </script>
  </head>
  <body style="background:#090d16; color:#94a3b8; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <p>Loading AI Photo Studio...</p>
  </body>
</html>
