<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Aperture Blades Gradient -->
    <linearGradient id="bladeGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Lens Flare Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Accent Ring -->
  <rect x="8" y="8" width="496" height="496" rx="116" stroke="url(#borderGrad)" stroke-width="12" stroke-opacity="0.85"/>
  <rect x="20" y="20" width="472" height="472" rx="104" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1"/>

  <!-- Camera Lens Outer Housing Ring -->
  <circle cx="256" cy="256" r="186" fill="#0b1120" stroke="#1e293b" stroke-width="8"/>
  <circle cx="256" cy="256" r="172" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Geometric Aperture Ring Blades -->
  <g transform="rotate(25, 256, 256)">
    <!-- Blade 1 -->
    <path d="M256 100 L370 170 L300 256 Z" fill="url(#bladeGrad)" fill-opacity="0.88"/>
    <!-- Blade 2 -->
    <path d="M370 170 L412 296 L300 256 Z" fill="url(#bladeGrad)" fill-opacity="0.94"/>
    <!-- Blade 3 -->
    <path d="M412 296 L338 398 L256 312 Z" fill="url(#bladeGrad)" fill-opacity="0.88"/>
    <!-- Blade 4 -->
    <path d="M338 398 L204 406 L230 286 Z" fill="url(#bladeGrad)" fill-opacity="0.94"/>
    <!-- Blade 5 -->
    <path d="M204 406 L108 316 L200 256 Z" fill="url(#bladeGrad)" fill-opacity="0.88"/>
    <!-- Blade 6 -->
    <path d="M108 316 L146 186 L230 236 Z" fill="url(#bladeGrad)" fill-opacity="0.94"/>
  </g>

  <!-- Central Lens Core Cavity -->
  <circle cx="256" cy="256" r="88" fill="#030712"/>
  <circle cx="256" cy="256" r="88" fill="url(#coreGlow)" fill-opacity="0.45" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="88" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Brilliant AI Sparkle / Star at Lens Center -->
  <!-- 4-point AI Diamond Star -->
  <path d="M256 176 C256 220 220 256 176 256 C220 256 256 292 256 336 C256 292 292 256 336 256 C292 256 256 220 256 176 Z" fill="#ffffff" filter="url(#softGlow)"/>
  
  <!-- Diagonal Micro-Sparkle Cross -->
  <path d="M256 206 C256 236 236 256 206 256 C236 256 256 276 256 306 C256 276 276 256 306 256 C276 256 256 236 256 206 Z" fill="#38bdf8" fill-opacity="0.9"/>

  <!-- Core White Flash Center Point -->
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
  <circle cx="248" cy="248" r="5" fill="#ffffff" fill-opacity="0.8"/>

  <!-- Top Right Camera Flash Indicator Dot -->
  <circle cx="396" cy="116" r="14" fill="#06b6d4" filter="url(#softGlow)"/>
  <circle cx="396" cy="116" r="8" fill="#ffffff"/>
</svg>
